<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#120018"/>
    <title>Bank Pet Dashboard</title>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <script defer src="/js/theme.js"></script>
</head>
<body>
<div class="container">
    <header class="header">
        <div>
            <h1>Bank Pet — Smart Banking</h1>
            <p th:text="${dashboard.clientName} + ' • ' + ${dashboard.phone}"></p>
        </div>
        <div class="header-actions">
            <span class="badge">ИИ-финконтроль включён</span>
            <button id="themeToggle" class="theme-toggle" type="button">🌙 Тёмная тема</button>
        </div>
    </header>

    <div class="notice" th:if="${notice != null and !notice.isBlank()}" th:text="${notice}"></div>

    <section class="grid">
        <div class="card">
            <h3>Счёт</h3>
            <p class="amount" th:text="${dashboard.accountBalance} + ' ₽'"></p>
            <small>Основной рублёвый счёт</small>
        </div>
        <div class="card accent">
            <h3>Цифровой рубль</h3>
            <p class="amount" th:text="${dashboard.digitalRubleBalance} + ' ₽'"></p>
            <p th:text="${dashboard.digitalRubleLinked} ? 'Кошелёк привязан' : 'Кошелёк не привязан'"></p>
            <form th:if="${!dashboard.digitalRubleLinked}" method="post" action="/app/link">
                <button type="submit">Привязать кошелёк</button>
            </form>
            <form th:if="${dashboard.digitalRubleLinked}" method="post" action="/app/topup" class="inline-form">
                <input type="number" name="amount" step="0.01" min="1" value="500"/>
                <button type="submit">Пополнить</button>
            </form>
        </div>

        <div class="card payment-card">
            <h3>NFC-оплата (эмуляция терминала)</h3>
            <form method="post" action="/app/nfc/pay" class="payment-form">
                <input name="merchant" required placeholder="Мерчант (например, OZON)"/>
                <input type="number" name="amount" required step="0.01" min="1" placeholder="Сумма"/>
                <select name="category" required>
                    <option value="OZON">OZON</option>
                    <option value="WB">WB</option>
                    <option value="ВКУСНЯШКИ">ВКУСНЯШКИ</option>
                    <option value="GAMES">GAMES</option>
                    <option value="BETTING">BETTING</option>
                    <option value="ALCOHOL">ALCOHOL</option>
                    <option value="CRYPTO">CRYPTO</option>
                </select>
                <input name="deviceToken" value="demo-nfc-token" placeholder="NFC token"/>
                <button type="submit">Оплатить по NFC</button>
            </form>
            <form method="post" action="/app/sync-history" class="inline-form" style="margin-top:8px;">
                <button type="submit">Подтянуть историю из других банков</button>
            </form>
        </div>

        <div class="card">
            <h3>Карты</h3>
            <ul>
                <li th:each="card : ${dashboard.cards}" th:text="${card}"></li>
            </ul>
        </div>

        <div class="card full-width">
            <h3>Понятные настройки AI-защиты</h3>
            <form method="post" action="/app/filters" class="payment-form">
                <label><input type="checkbox" name="llmAgentEnabled" th:checked="${filters.llmAgentEnabled}"/> Анализировать траты LLM-агентом</label>
                <label><input type="checkbox" name="hardBlockEnabled" th:checked="${filters.hardBlockEnabled}"/> Полностью блокировать запрещенные категории</label>
                <input type="number" name="confirmationThreshold" step="0.01" min="1" th:value="${filters.confirmationThreshold}" placeholder="Сумма, с которой нужно подтверждение"/>
                <input type="text" name="blockedCategoriesCsv" th:value="${filters.blockedCategoriesCsv}" placeholder="Что блокируем (через запятую)"/>
                <input type="text" name="riskyCategoriesCsv" th:value="${filters.riskyCategoriesCsv}" placeholder="Что считаем рискованным"/>
                <button type="submit">Сохранить настройки защиты</button>
            </form>
            <small>Степени реакции агента: SOFT (мягко), MEDIUM (строже), HARD (жесткая блокировка).</small>
        </div>

        <div class="card full-width">
            <h3>Последние операции</h3>
            <ul class="trx-list">
                <li th:each="trx : ${dashboard.recentTransactions}">
                    <span th:text="${trx.title} + ' (' + ${trx.category} + ', ' + ${trx.sourceType} + ')' "></span>
                    <strong th:text="${trx.amount} + ' ₽'"></strong>
                </li>
            </ul>
        </div>
    </section>
</div>
</body>
</html>
