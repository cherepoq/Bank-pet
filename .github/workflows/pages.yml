name: Deploy RentFlow preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/templates/dashboard.html'
      - 'src/main/resources/static/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble static preview
        run: |
          first_css_line="$(sed -n '1p' src/main/resources/static/css/style.css)"
          test "$first_css_line" = ':root {'
          grep -q '^\.app-header {' src/main/resources/static/css/style.css
          grep -q '^\.bottom-nav {' src/main/resources/static/css/style.css
          grep -q 'css/style.css?v=' src/main/resources/templates/dashboard.html
          mkdir -p _site
          cp src/main/resources/templates/dashboard.html _site/index.html
          cp -R src/main/resources/static/. _site/
          sed -i 's#"start_url": "/app"#"start_url": "./"#; s#"scope": "/"#"scope": "./"#; s#"src": "/icons/#"src": "./icons/#' _site/manifest.webmanifest
          printf '%s' '${{ github.sha }}' > _site/revision.txt
          printf '%s\n' "RentFlow UI ${GITHUB_SHA} · complete mobile stylesheet" > _site/build-info.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
