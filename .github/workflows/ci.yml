name: RentFlow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend syntax
        run: |
          node --check src/main/resources/static/js/theme.js
          node --check src/main/resources/static/js/secure-storage.js
          ./android/scripts/pre_release_check.sh
      - name: Backend tests
        run: mvn --batch-mode test
      - name: Build production jar
        run: mvn --batch-mode -DskipTests package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: rentflow-server
          path: target/*.jar
          if-no-files-found: error
